name: Проверки ProductPulse
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest --cov=productpulse --cov-report=term-missing -q
      - run: productpulse --database sqlite:///ci-demo.db demo --users 80 --weeks 6
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pulse_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: pulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pulse_test -d pulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PRODUCTPULSE_TEST_DATABASE_URL: postgresql+psycopg://pulse_test:local_test_only@localhost:5432/pulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m pytest -q
