[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "productpulse"
version = "0.1.0"
description = "Проверяемая аналитика аренды с историческими срезами знания"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0.36,<3", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[project.scripts]
productpulse = "productpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
productpulse = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
